<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" role="img" aria-label="BOUW">
  <title>BOUW</title>
  <!-- Marca BOUW. Version positiva, dos tintas.
       Los dos boceles no cierran contra el asta: el hueco es la unica pieza que
       dice "ciclo", y se eligio despues de comprobar que cualquier punta de
       flecha lo bastante pequeña para no deformar la letra desaparece a 9 mm.
       Tamaño minimo recomendado: 9 mm de alto. -->
  <rect x="10" y="10" width="21" height="100" fill="#14395F"/>
  <g fill="none" stroke-width="18" stroke-linecap="butt">
    <path d="M38 19 H52 A19.5 19.5 0 0 1 52 58 H38" stroke="#1E9FB5"/>
    <path d="M38 58 H56 A21.5 21.5 0 0 1 56 101 H38" stroke="#14395F"/>
  </g>
</svg>
