<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="BOUW">
  <title>BOUW</title>
  <!-- Marca BOUW. Sello, version principal.
       El circulo no es un adorno: es el ciclo. Hace el trabajo que no podia
       hacer una punta de flecha, porque a 9 mm una flecha desaparece y un
       circulo no. Tamano minimo: 9 mm de diametro. -->
  <circle cx="70" cy="70" r="70" fill="#14395F"/>
  <g transform="translate(36.8,24.4) scale(0.76)">
    <rect x="10" y="10" width="21" height="100" fill="#FFFFFF"/>
    <g fill="none" stroke-width="18" stroke-linecap="butt">
      <path d="M38 19 H52 A19.5 19.5 0 0 1 52 58 H38" stroke="#7FD4E3"/>
      <path d="M38 58 H56 A21.5 21.5 0 0 1 56 101 H38" stroke="#FFFFFF"/>
    </g>
  </g>
</svg>
